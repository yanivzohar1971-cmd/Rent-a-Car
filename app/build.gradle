plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.rentacar.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.rentacar.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // AGENT-101: `standard` is the production channel (applicationId com.rentacar.app).
    // `agentdev` is an isolated, offline development APK (com.rentacar.app.agentdev) that hosts the
    // 127.0.0.1 Agent gateway on an emulator. It must never talk to production Firebase.
    flavorDimensions "channel"
    productFlavors {
        standard {
            dimension "channel"
            isDefault true
            buildConfigField "boolean", "AGENT_DEV_MODE", "false"
            buildConfigField "String", "AGENT_DEV_UID", "\"\""
            buildConfigField "int", "AGENT_DEV_PORT", "0"
            buildConfigField "String", "AGENT_DEV_PAIRING_SECRET", "\"\""
        }
        agentdev {
            dimension "channel"
            applicationIdSuffix ".agentdev"
            resValue "string", "app_name", "Rent a Car AgentDev"
            buildConfigField "boolean", "AGENT_DEV_MODE", "true"
            buildConfigField "String", "AGENT_DEV_UID", "\"agent-dev-uid\""
            buildConfigField "int", "AGENT_DEV_PORT", "18765"
            buildConfigField "String", "AGENT_DEV_PAIRING_SECRET", "\"rentacar-agentdev-local-only\""
        }
    }

    buildTypes {
        debug {
            buildConfigField "boolean", "FIREBASE_DEBUG_LOGGING_ENABLED", "true"
            manifestPlaceholders = [debugSyncReceiverEnabled: "true"]
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "boolean", "FIREBASE_DEBUG_LOGGING_ENABLED", "false"
            manifestPlaceholders = [debugSyncReceiverEnabled: "false"]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
        buildConfig true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.14'
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
            excludes += 'META-INF/NOTICE.md'
            excludes += 'META-INF/LICENSE.md'
            excludes += 'META-INF/DEPENDENCIES'
        }
    }

    testOptions {
        unitTests.includeAndroidResources = true
        animationsDisabled = true
    }
}

// AGENT-101: google-services.json only matches package com.rentacar.app. The agentdev variants
// (com.rentacar.app.agentdev) must stay offline, so skip Google Services processing for them
// instead of pointing them at the production Firebase project.
tasks.configureEach { task ->
    if (task.name.contains("Agentdev") && task.name.contains("GoogleServices")) {
        task.enabled = false
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.3'

    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.ui:ui-text-google-fonts'
    implementation 'com.google.android.material:material:1.12.0'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // Navigation
    implementation 'androidx.navigation:navigation-compose:2.7.7'

    // Room
    implementation 'androidx.room:room-ktx:2.6.1'
    implementation 'androidx.room:room-runtime:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'

    // DataStore
    implementation 'androidx.datastore:datastore-preferences:1.1.1'

    // WorkManager
    implementation 'androidx.work:work-runtime-ktx:2.9.0'

    // Gson for JSON backup
    implementation 'com.google.code.gson:gson:2.10.1'
    
    // Apache POI for Excel parsing
    // Note: We avoid using autoSizeColumn() which requires AWT (not available on Android)
    implementation 'org.apache.poi:poi:5.2.5'
    implementation 'org.apache.poi:poi-ooxml:5.2.5'

    // Gmail IMAP (App Password) + MIME
    implementation 'com.sun.mail:android-mail:1.6.7'
    implementation 'com.sun.mail:android-activation:1.6.7'

    // HTML table parsing for commission emails
    implementation 'org.jsoup:jsoup:1.17.2'

    // Encrypted storage for mailbox App Password
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // Lifecycle
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.3'

    // Firebase
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-firestore-ktx'
    implementation 'com.google.firebase:firebase-auth-ktx'
    implementation 'com.google.firebase:firebase-functions-ktx'
    implementation 'com.google.firebase:firebase-storage-ktx'
    
    // Google Sign-In
    implementation 'com.google.android.gms:play-services-auth:21.2.0'
    
    // Coil for image loading
    implementation 'io.coil-kt:coil-compose:2.5.0'

    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.12.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1'

    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}


